name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync to test S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_TEST_BUCKET }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "*.md" \
            --exclude "Dockerfile" \
            --exclude ".dockerignore" \
            --exclude ".gitignore" \
            --exclude "nginx.conf" \
            --exclude "*.sh" \
            --exclude "test" \
            --delete

      - name: Invalidate test CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_TEST_ID }} \
            --paths "/*"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync to prod S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_PROD_BUCKET }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "*.md" \
            --exclude "Dockerfile" \
            --exclude ".dockerignore" \
            --exclude ".gitignore" \
            --exclude "nginx.conf" \
            --exclude "*.sh" \
            --exclude "test" \
            --delete

      - name: Invalidate prod CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_PROD_ID }} \
            --paths "/*"
